name: Teşhis (LJ-Wix)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: node scripts/probe-lj-wix.mjs
        env:
          LINKJOURNAL_API_URL: ${{ secrets.LINKJOURNAL_API_URL }}
          LINKJOURNAL_API_KEY: ${{ secrets.LINKJOURNAL_API_KEY }}
